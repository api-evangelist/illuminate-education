name: Illuminate Education
description: >-
  Illuminate Education is a K-12 education technology company providing assessment, data
  analytics, and Multi-Tiered System of Supports (MTSS) tools to schools and districts. Its
  platform serves roughly 17 million students across 5,200 schools and districts in all 50
  states, taking a "whole child" approach that combines academic and social-emotional-behavioral
  data. Marquee products are FastBridge (universal screening and progress monitoring), DnA
  (standards-based assessment creation and scoring), and eduCLIMBER (MTSS collaboration and
  district data management). Illuminate does not publish a public developer API portal or
  OpenAPI; data exchange runs through education-interoperability standards (LTI 1.0/1.1
  Certified, OneRoster, Ed-Fi 2.5+, QTI) and partner/SIS/LMS integrations. It is a portfolio
  company of Insight Partners, headquartered in Irvine, California.
